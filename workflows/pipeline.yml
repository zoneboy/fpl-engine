name: FPL Engine Pipeline

on:
  schedule:
    - cron: "0 6 * * *"        # daily 06:00 UTC (07:00 WAT) snapshot
    - cron: "*/20 15-18 * * 5,6"  # every 20 min Fri/Sat 15:00-18:59 UTC (deadline window)
  workflow_dispatch:
    inputs:
      gw:
        description: "Gameweek"
        required: true
      mode:
        description: "daily | deadline"
        default: "daily"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIVAL_IDS: ${{ secrets.RIVAL_IDS }}
        run: |
          MODE="${{ github.event.inputs.mode || 'daily' }}"
          GW="${{ github.event.inputs.gw || '1' }}"
          python run_pipeline.py --gw "$GW" --mode "$MODE"
