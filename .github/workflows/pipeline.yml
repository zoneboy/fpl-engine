name: FPL Engine Pipeline

on:
  schedule:
    - cron: "0 6 * * *"            # daily 06:00 UTC (07:00 WAT) — snapshot + solve
    - cron: "0 4 * * 2"            # Tuesday 04:00 UTC — weekly match-history refresh
    - cron: "7,37 * * * *"         # deadline watch — gated on the real FPL deadline (gameweek.py)
  workflow_dispatch:
    inputs:
      gw:
        description: "Gameweek (leave blank to auto-detect the next deadline)"
        required: false
        default: ""
      mode:
        description: "Run mode"
        type: choice
        options: [daily, weekly, deadline]
        default: "daily"

# One pipeline at a time: a deadline slot waits for a running daily job
# instead of racing it on the same Neon tables.
concurrency:
  group: fpl-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Resolve mode from schedule
        id: cfg
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "0 4 * * 2")      MODE="weekly" ;;
              "7,37 * * * *")   MODE="deadline" ;;
              *)                MODE="daily" ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # Blank (all scheduled runs) -> run_pipeline auto-detects from the FPL API
          GW="$(echo "$GW_INPUT" | tr -d '[:space:]')"
          if [ -n "$GW" ] && ! [[ "$GW" =~ ^[0-9]+$ ]]; then
            echo "::error::gw input must be a number or blank, got '$GW'"; exit 1
          fi
          echo "gw_arg=${GW:+--gw $GW}" >> "$GITHUB_OUTPUT"
        env:
          GW_INPUT: ${{ github.event.inputs.gw }}

      # Scheduled deadline slots fire every 30 min; most are skipped here in
      # seconds (stdlib only, runner's own python3, no pip install, no odds call).
      # Manual deadline runs bypass the gate.
      - name: Deadline gate
        id: gate
        if: steps.cfg.outputs.mode == 'deadline' && github.event_name == 'schedule'
        run: python3 gameweek.py

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run != 'false'
        with:
          python-version: "3.12"
          cache: "pip"
      - if: steps.gate.outputs.run != 'false'
        run: pip install -r requirements.txt

      - name: Run pipeline
        if: steps.gate.outputs.run != 'false'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RIVAL_IDS: ${{ secrets.RIVAL_IDS }}
          MY_ENTRY_ID: ${{ secrets.MY_ENTRY_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_pipeline.py ${{ steps.cfg.outputs.gw_arg }} --mode "${{ steps.cfg.outputs.mode }}"
