name: FPL Engine Pipeline

on:
  schedule:
    - cron: "0 6 * * *"            # daily 06:00 UTC (07:00 WAT) — snapshot + solve
    - cron: "0 4 * * 2"            # Tuesday 04:00 UTC — weekly match-history refresh
    - cron: "*/20 15-19 * * 5,6"   # Fri/Sat 15:00-19:59 UTC — deadline watch
  workflow_dispatch:
    inputs:
      gw:
        description: "Gameweek"
        required: true
        default: "1"
      mode:
        description: "daily | weekly | deadline"
        default: "daily"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Resolve mode from schedule
        id: cfg
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "0 4 * * 2")            MODE="weekly" ;;
              "*/20 15-19 * * 5,6")   MODE="deadline" ;;
              *)                      MODE="daily" ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "gw=${{ github.event.inputs.gw || vars.CURRENT_GW || '1' }}" >> "$GITHUB_OUTPUT"

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RIVAL_IDS: ${{ secrets.RIVAL_IDS }}
          MY_ENTRY_ID: ${{ secrets.MY_ENTRY_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_pipeline.py --gw "${{ steps.cfg.outputs.gw }}" --mode "${{ steps.cfg.outputs.mode }}"
