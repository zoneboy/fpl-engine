name: FPL Engine Pipeline

on:
  schedule:
    - cron: "0 6 * * *"            # daily 06:00 UTC (07:00 WAT) — snapshot + solve
    - cron: "0 4 * * 2"            # Tuesday 04:00 UTC — weekly match-history refresh
    - cron: "*/20 15-19 * * 5,6"   # Fri/Sat 15:00-19:59 UTC — deadline watch
  workflow_dispatch:
    inputs:
      gw:
        description: "Gameweek (leave blank to auto-detect the next deadline)"
        required: false
        default: ""
      mode:
        description: "Run mode"
        type: choice
        options: [daily, weekly, deadline]
        default: "daily"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Resolve mode from schedule
        id: cfg
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "0 4 * * 2")            MODE="weekly" ;;
              "*/20 15-19 * * 5,6")   MODE="deadline" ;;
              *)                      MODE="daily" ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # Blank (all scheduled runs) -> run_pipeline auto-detects from the FPL API
          GW="$(echo "$GW_INPUT" | tr -d '[:space:]')"
          if [ -n "$GW" ] && ! [[ "$GW" =~ ^[0-9]+$ ]]; then
            echo "::error::gw input must be a number or blank, got '$GW'"; exit 1
          fi
          echo "gw_arg=${GW:+--gw $GW}" >> "$GITHUB_OUTPUT"
        env:
          GW_INPUT: ${{ github.event.inputs.gw }}

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RIVAL_IDS: ${{ secrets.RIVAL_IDS }}
          MY_ENTRY_ID: ${{ secrets.MY_ENTRY_ID }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_pipeline.py ${{ steps.cfg.outputs.gw_arg }} --mode "${{ steps.cfg.outputs.mode }}"
